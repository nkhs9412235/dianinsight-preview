<!doctype html><html lang="zh-Hant" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>看店勢 DianInsight — Emulator v5.2</title><style>
:root{--bg:#f5f7fa;--s:#fff;--s2:#f8fafc;--b:#d9dee7;--t:#1f2937;--m:#6b7280;--p:#1678d2;--ok:#22824c;--bad:#c63c49;--i:#fff}html[data-theme=dark]{--bg:#18191c;--s:#23252a;--s2:#202226;--b:#34373d;--t:#f4f5f7;--m:#9da3ad;--p:#2d97ed;--ok:#6bd28d;--bad:#ff6d79;--i:#1b1d21}*{box-sizing:border-box;min-width:0}html,body{margin:0;max-width:100%;overflow-x:hidden;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit;max-width:100%}button{cursor:pointer}input,select{display:block;width:100%;min-width:0;background:var(--i);border:1px solid var(--b);color:var(--t);border-radius:7px;padding:9px 10px;min-height:40px}.topbar{height:62px;background:var(--s);border-bottom:1px solid var(--b);position:sticky;top:0;z-index:30;display:flex;align-items:center}.topbar-inner{width:100%;max-width:1280px;margin:auto;padding:0 16px;display:flex;align-items:center;gap:10px}.brand{display:flex;align-items:center;gap:9px;font-weight:800;white-space:nowrap}.logo{width:36px;height:36px;flex:0 0 36px;border-radius:11px;background:linear-gradient(145deg,#80b2ff,#4a87ff 48%,#65e9ff);position:relative;overflow:hidden}.logo:before{content:"";position:absolute;bottom:8px;left:9px;width:5px;height:11px;border-radius:9px;background:#07101f;box-shadow:8px -6px #07101f,16px -13px #07101f}.nav{display:flex;gap:2px;flex:1;overflow:auto}.nav a,.drawer a{color:inherit;text-decoration:none;padding:9px;border-radius:7px;white-space:nowrap}.nav a.active,.drawer a.active{background:var(--s2);color:var(--p)}.account{display:flex;gap:7px}.menu{display:none;order:-1;border:0;background:none;color:var(--t);font-size:26px;padding:5px}.btn{border:1px solid var(--b);background:var(--s2);color:var(--t);border-radius:7px;padding:8px 12px;min-height:38px}.primary{background:var(--p);border-color:var(--p);color:#fff}.danger{color:var(--bad);border-color:var(--bad)}.container{width:100%;max-width:1180px;margin:auto;padding:24px 18px 48px}.title{margin:0 0 18px;font-size:26px}.panel,.card{width:100%;max-width:100%;background:var(--s);border:1px solid var(--b);border-radius:9px;padding:16px;overflow:hidden}.toolbar{display:flex;flex-wrap:wrap;align-items:end;gap:10px;width:100%}.field{display:grid;gap:5px;flex:1 1 160px;min-width:0}.field label,.muted{color:var(--m);font-size:12px}.quick{display:flex;flex-wrap:wrap;gap:6px;width:100%;margin-top:8px}.quick button{border:1px solid var(--b);background:var(--s2);color:var(--t);border-radius:99px;padding:5px 10px}.scope{color:var(--m);font-size:13px;overflow-wrap:anywhere}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.kpi{background:var(--s);border:1px solid var(--b);border-radius:9px;padding:14px;overflow:hidden}.kpi small{color:var(--m)}.kpi strong{display:block;font-size:23px;margin-top:8px;overflow-wrap:anywhere}.section{margin-top:20px}h2{font-size:18px}.tablewrap{width:100%;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--b);border-radius:8px}.table{width:100%;border-collapse:collapse;background:var(--s);font-size:13px}.table th,.table td{padding:10px 12px;border-bottom:1px solid var(--b);text-align:left;white-space:nowrap}.table th{color:var(--m);background:var(--s2)}.tabs{display:flex;overflow:auto;gap:5px;margin-bottom:14px}.tab{white-space:nowrap}.cards{display:none}.meta{display:grid;grid-template-columns:100px minmax(0,1fr);gap:7px;font-size:13px}.meta span:nth-child(odd){color:var(--m)}.actions{display:flex;flex-wrap:wrap;gap:7px}.good{color:var(--ok)}.bad{color:var(--bad)}.drawer-shell{display:none}.hidden{display:none!important}
@media(max-width:860px){.nav,.account .desktop{display:none}.menu{display:block}.brand{margin-right:auto}.container{padding:18px 14px 36px}.title{font-size:22px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.drawer-shell{position:fixed;inset:0;z-index:80}.drawer-shell.open{display:block}.scrim{position:absolute;inset:0;background:#0009}.drawer{position:absolute;inset:0 auto 0 0;width:min(88vw,380px);max-width:100%;background:var(--s);padding:18px 14px;overflow:auto}.drawer-brand{display:flex;align-items:center;gap:9px;font-weight:800;margin-bottom:18px}.drawer nav{display:grid}.desktop-table{display:none}.cards{display:grid;gap:10px}.toolbar{display:grid;grid-template-columns:minmax(0,1fr);align-items:stretch}.toolbar>.field,.toolbar>button,.toolbar>.actions{width:100%;max-width:100%}.toolbar>.actions button{width:auto}.panel,.card{padding:14px}.tablewrap{overflow-x:auto}.scope{line-height:1.5}.section{max-width:100%;overflow:hidden}}
@media(max-width:480px){.topbar-inner{padding:0 12px}.brand{font-size:14px}.logo{width:32px;height:32px;flex-basis:32px}.account .btn{padding:7px 10px}.container{padding-left:14px;padding-right:14px}.kpi strong{font-size:20px}.field{width:100%;max-width:100%}input[type=date]{-webkit-appearance:none;appearance:none;width:100%;max-width:100%;min-width:0}.quick{max-width:100%}.quick button{flex:0 1 auto}.meta{grid-template-columns:88px minmax(0,1fr)}}
</style></head><body><header class="topbar"><div class="topbar-inner"><div class="brand"><span class="logo"></span><span>看店勢 DianInsight</span></div><nav class="nav" id="nav"></nav><div class="account"><button class="btn" id="lang">EN</button><button class="btn theme">☀️</button><a class="btn desktop" href="/">回介紹頁</a></div><button class="menu" id="menu">☰</button></div></header><div class="drawer-shell" id="drawer"><div class="scrim" id="scrim"></div><aside class="drawer"><div class="drawer-brand"><span class="logo"></span>看店勢 DianInsight</div><nav id="dnav"></nav></aside></div><main class="container" id="main"></main><script>
const P=[['dashboard','儀表板'],['sales','銷售'],['rankings','排行榜'],['notifications','通知'],['recipients','收件人'],['organization','組織'],['security','安全紀錄'],['modules','模組']],M=document.getElementById('main'),D=document.getElementById('drawer');function links(){return P.map(x=>`<a href="#${x[0]}" data-p="${x[0]}">${x[1]}</a>`).join('')}nav.innerHTML=links();dnav.innerHTML=links();menu.onclick=()=>D.classList.add('open');scrim.onclick=()=>D.classList.remove('open');document.querySelectorAll('[data-p]').forEach(a=>a.onclick=e=>{e.preventDefault();render(a.dataset.p);D.classList.remove('open')});document.querySelectorAll('.theme').forEach(b=>b.onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';b.textContent=document.documentElement.dataset.theme==='dark'?'☀️':'🌙'});function active(p){document.querySelectorAll('[data-p]').forEach(a=>a.classList.toggle('active',a.dataset.p===p))}function shell(t,b){M.innerHTML=`<h1 class="title">${t}</h1>${b}`}const q=`<div class="quick">${['今天','昨天','最近 7 天','最近 30 天','本週','上週','本月','上月'].map(x=>`<button>${x}</button>`).join('')}</div>`;function filters(extra=''){return `<div class="panel"><div class="toolbar"><div class="field"><label>開始日期</label><input type="date" value="2026-08-01"></div><div class="field"><label>結束日期</label><input type="date" value="2026-08-31"></div>${extra}<button class="btn">重新整理</button>${q}</div></div>`}function k(l,v){return `<div class="kpi"><small>${l}</small><strong>${v}</strong></div>`}function dash(){shell('儀表板',filters()+`<p class="scope">期間：2026/08/01 ～ 2026/08/31　比較期間：2025/08/01 ～ 2025/08/31</p><div class="kpis">${k('營收','NT$1,063,795')}${k('目標營收','NT$1,440,000')}${k('達成率','73.87%')}${k('交易數','5,408')}${k('來客數','5,875')}${k('本月累計營收','NT$1,063,795')}</div>`)}function sales(){shell('銷售',filters(`<div class="field"><label>區域</label><select><option>所有區域</option><option>北一區</option></select></div><div class="field"><label>分店</label><select><option>所有分店</option><option>台北A店</option></select></div>`)+`<p class="scope">目前檢視：全部 ＞ 全部分店</p><div class="kpis">${k('營收','NT$1,063,795')}${k('目標','NT$1,440,000')}${k('達成率','73.87%')}${k('交易數','5,408')}</div><section class="section card"><h2>AI 分析</h2><button class="btn primary" onclick="this.nextElementSibling.classList.remove('hidden')">AI 分析</button><div class="hidden"><p>整體營收 1,063,795 元，目標達成率 73.87%，較去年同期成長 3.62%。</p><div class="tablewrap"><table class="table"><tr><th>店鋪</th><th>營收</th><th>交易</th><th>來客</th><th>達成率</th></tr><tr><td>台北A店</td><td>361,627</td><td>2,138</td><td>2,205</td><td>76.94%</td></tr></table></div></div></section><section class="section card"><h2>上傳業績資料</h2><input type="file" accept=".xlsx"><br><button class="btn primary">上傳資料</button></section>`)}function rankings(){shell('排行榜',filters(`<div class="field"><label>區域</label><select><option>所有區域</option></select></div><div class="field"><label>分店</label><select><option>所有分店</option></select></div>`)+`<section class="section"><h2>區域排名</h2>${table(['排名','名稱','達成率','營收'],[['1','北一區','73.87%','NT$1,063,795'],['2','北二區','69.12%','NT$918,420']])}</section>`)}function table(h,r){return `<div class="tablewrap"><table class="table"><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r.map(y=>`<tr>${y.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}function notifications(){shell('通知',`<div class="card"><h2>Email 通知</h2><b class="good">已啟用</b></div><section class="section"><h2>手動寄送報表</h2><form class="card toolbar" onsubmit="event.preventDefault()"><div class="field"><label>開始日期</label><input type="date" value="2026-09-01"></div><div class="field"><label>結束日期</label><input type="date" value="2026-09-12"></div><div class="field"><label>區域</label><select><option>北一區</option></select></div><div class="field"><label>收件人</label><select><option>營運主管 — ops@example.com</option></select></div><button class="btn primary">寄送報表</button></form></section><section class="section"><h2>寄送測試 Email</h2><form class="card toolbar"><div class="field"><label>收件人 Email</label><input value="admin@example.com"></div><button class="btn">寄送</button></form></section>`)}let R=[['營運主管','ops@example.com','開啟'],['北區主管','north@example.com','開啟'],['備援信箱','backup@example.com','關閉']];function recipients(){shell('收件人',`<h2>新增收件人</h2><form class="card toolbar" onsubmit="event.preventDefault()"><div class="field"><label>名稱</label><input></div><div class="field"><label>Email</label><input type="email"></div><button class="btn primary">新增</button></form><section class="section"><h2>收件人清單</h2>${table(['名稱','Email','狀態','操作'],R.map(x=>[...x,'編輯 · 停用 · 刪除']))}</section>`)}const U=[['Bob','M088','bob@gmail.com','門市主管','台北B店','等待啟用'],['C001','C001','c001@gmail.com','區域主管','北一區','已啟用'],['RIO','M006','rio@gmail.com','門市主管','桃園A店','等待啟用']];function org(){shell('組織',`<div class="tabs"><button class="btn tab" onclick="ot('r')">區域列表</button><button class="btn tab" onclick="ot('s')">分店列表</button><button class="btn tab" onclick="ot('u')">使用者</button></div><div id="orgbody"></div>`);ot('r')}window.ot=x=>{orgbody.innerHTML=x==='r'?table(['區域名稱','編輯','刪除'],[['北一區','編輯','刪除'],['北二區','編輯','刪除']]):x==='s'?table(['代碼','分店名稱','區域','狀態'],[['A001','台北A店','北一區','啟用中'],['A002','台北B店','北一區','啟用中']]):`<div class="card toolbar"><div class="field"><label>搜尋</label><input placeholder="姓名、帳號或 Email"></div><div class="field"><label>角色</label><select><option>所有角色</option></select></div><button class="btn primary">搜尋</button></div><div class="section">${table(['姓名','帳號','Email','角色','範圍','狀態'],U)}</div>`};function security(){shell('安全紀錄',`<form class="card toolbar"><div class="field"><label>事件</label><select><option>全部</option><option>登入成功</option></select></div><div class="field"><label>嚴重性</label><select><option>全部</option><option>INFO</option></select></div><div class="field"><label>結果</label><select><option>全部</option><option>成功</option></select></div><div class="field"><label>驗證方式</label><select><option>全部</option><option>password</option></select></div><button class="btn primary">套用</button></form><section class="section">${table(['時間','事件','結果','嚴重性','使用者','IP'],[['2026-09-12 12:48','登入成功','成功','INFO','Bob','100.67.105.115'],['2026-09-12 10:16','登入失敗','失敗','WARNING','unknown','203.0.113.55']])}</section>`)}function modules(){shell('模組','<div class="card"><p class="muted">尚未取得正式產品的 Modules template，因此不自行杜撰模組內容。</p></div>')}function render(p){active(p);({dashboard:dash,sales,rankings,notifications,recipients,organization:org,security,modules}[p]||dash)();scrollTo(0,0);history.replaceState(null,'','#'+p)}render(P.some(x=>x[0]===location.hash.slice(1))?location.hash.slice(1):'dashboard');
</script></body></html>
