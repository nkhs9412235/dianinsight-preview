<style>

html[data-theme="dark"]{--bg:#18191c;--surface:#23252a;--surface2:#202226;--border:#34373d;--text:#f4f5f7;--muted:#9da3ad;--primary:#2d97ed;--primary2:#1678d2;--danger:#ff6d79;--ok:#6bd28d;--warn:#f1c85d;--input:#1b1d21;--table:#202226;--shadow:0 8px 30px rgb(0 0 0 / 20%)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}a{color:inherit}.hidden{display:none!important}.muted,.small{color:var(--muted)}.small{font-size:12px}.empty{padding:18px;text-align:center;color:var(--muted)}
.topbar{height:62px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;position:sticky;top:0;z-index:40}.topbar-inner{width:100%;max-width:1280px;margin:auto;display:flex;align-items:center;gap:12px;padding:0 16px}.brand{display:flex;align-items:center;gap:9px;font-weight:800;white-space:nowrap}.logo-mark{width:36px;height:36px;border-radius:11px;position:relative;flex:0 0 36px;background:linear-gradient(145deg,#80b2ff 0%,#4a87ff 48%,#65e9ff 100%);box-shadow:0 0 0 1px rgba(255,255,255,.16) inset,0 8px 22px rgba(66,136,255,.26);overflow:hidden}.logo-mark:before{content:"";position:absolute;bottom:8px;left:9px;width:5px;height:11px;border-radius:999px;background:#07101f;box-shadow:8px -6px 0 #07101f,16px -13px 0 #07101f}.env-badge{font-size:10px;border:1px solid #8e3040;color:#ff7d8c;border-radius:999px;padding:2px 7px}.desktop-nav{display:flex;align-items:center;gap:2px;overflow:auto;flex:1}.desktop-nav a{padding:9px 8px;text-decoration:none;border-radius:6px;font-size:13px;white-space:nowrap}.desktop-nav a.active,.desktop-nav a:hover{background:var(--surface2);color:var(--primary)}.account{display:flex;align-items:center;gap:7px;white-space:nowrap}.account .who{font-size:12px;color:var(--muted)}.mobile-menu-toggle{display:none;order:-1;border:0;background:transparent;color:var(--text);font-size:24px;padding:7px 7px 7px 0;margin:0}.btn{border:1px solid var(--border);border-radius:6px;min-height:38px;padding:8px 12px;background:var(--surface2);color:var(--text);font-weight:600}.btn:hover{filter:brightness(.98)}.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn-danger{background:transparent;border-color:var(--danger);color:var(--danger)}.btn-ghost{background:transparent}.btn-sm{min-height:31px;padding:5px 9px;font-size:12px}.container{max-width:1180px;margin:0 auto;padding:24px 18px 48px}.page-title{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}.page-title h1,h1{font-size:26px;margin:0}.page-title p{margin:6px 0 0;color:var(--muted)}h2{font-size:18px;margin:24px 0 12px}.section{margin-top:20px}.card,.panel{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;box-shadow:var(--shadow)}
.toolbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.form-field{display:grid;gap:5px;min-width:150px;flex:1}.form-field label,label{font-size:12px;color:var(--muted)}input,select{width:100%;background:var(--input);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px 10px;min-height:38px}.quick-range{display:flex;flex-wrap:wrap;gap:6px;width:100%;margin-top:8px}.qr-btn{border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:999px;padding:5px 10px;font-size:12px}.scope-indicator{color:var(--muted);font-size:13px}.kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.kpi{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px;min-height:92px}.kpi-label{font-size:12px;color:var(--muted);margin-bottom:8px}.kpi-value{font-size:24px;font-weight:800}.kpi-sub{font-size:12px;color:var(--muted);margin-top:5px}.comparison-positive{color:var(--ok)}.comparison-negative{color:var(--danger)}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:8px}.table{width:100%;border-collapse:collapse;background:var(--surface);font-size:13px}.table th,.table td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top}.table th{background:var(--table);color:var(--muted);font-size:12px}.table tr:last-child td{border-bottom:0}.status-on{color:var(--ok);font-weight:700}.status-off{color:var(--danger);font-weight:700}.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:11px;border:1px solid var(--border)}.badge.good{color:var(--ok)}.badge.wait{color:var(--warn)}.badge.bad{color:var(--danger)}
.ai-grid{display:grid;gap:10px;margin-top:12px}.ai-card{position:relative}.ai-card:before{content:"";position:absolute;left:-1px;top:-1px;bottom:-1px;width:4px;border-radius:8px 0 0 8px;background:var(--primary)}.ai-card.warn:before{background:var(--danger)}.ai-title{font-weight:750;margin-bottom:8px}.ai-body{font-size:13px;line-height:1.65}.ai-body ul{margin:6px 0;padding-left:20px}.upload-box{display:grid;gap:10px}.flash{padding:10px 12px;border-radius:7px;margin:10px 0;font-size:13px}.flash-ok{border:1px solid #39724d;color:var(--ok)}.flash-err{border:1px solid #8e3040;color:var(--danger)}
.tabs{display:flex;gap:5px;overflow:auto;margin-bottom:16px}.tab-btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:6px;padding:8px 14px;white-space:nowrap}.tab-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}.tab-pane{display:none}.tab-pane.active{display:block}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.user-list,.recipient-cards,.security-cards{display:none}.user-card,.recipient-card,.security-card{display:grid;gap:10px}.meta{display:grid;grid-template-columns:120px minmax(0,1fr);gap:7px 10px;font-size:13px}.meta .k{color:var(--muted)}.action-row{display:flex;gap:7px;flex-wrap:wrap}.filter-panel{display:grid;gap:10px}.resultline{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;margin:12px 0}.security-details{margin-top:6px}.security-details summary{cursor:pointer;color:var(--primary)}.security-details dl{display:grid;gap:5px;font-size:12px}.security-details dl div{display:grid;grid-template-columns:120px 1fr;gap:8px}.security-details dt{color:var(--muted)}.security-details dd{margin:0}.user-detail{max-width:900px;margin:auto}.detail-row{display:grid;grid-template-columns:180px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid var(--border)}.detail-row:last-child{border-bottom:0}.detail-row .k{color:var(--muted)}.link{color:var(--primary);text-decoration:none}.link:hover{text-decoration:underline}.plan-badge{border:1px solid var(--border);border-radius:999px;padding:5px 9px;font-size:11px}.quota-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.quota-card{border:1px solid var(--border);border-radius:7px;padding:12px;background:var(--surface2)}.quota-card span{display:block;color:var(--muted);font-size:11px}.quota-card strong{display:block;margin-top:6px}.mobile-nav{display:none}
@media(max-width:860px){.desktop-nav,.account .who,.account .logout{display:none}.mobile-menu-toggle{display:block;order:-1;margin:0 2px 0 0}.topbar-inner{gap:8px;justify-content:flex-start}.brand{margin-right:auto}.account{margin-left:0}.mobile-nav{position:fixed;inset:0;z-index:80;display:none}.mobile-nav.open{display:block}.mobile-nav .scrim{position:absolute;inset:0;background:#0008}.mobile-nav .drawer{position:absolute;left:0;top:0;bottom:0;width:min(88vw,380px);background:var(--surface);border-right:1px solid var(--border);padding:18px 14px;overflow:auto}.drawer-title{display:flex;align-items:center;gap:9px;font-weight:800;margin-bottom:18px}.drawer-links{display:grid;gap:3px}.drawer-links a{padding:11px 10px;text-decoration:none;border-radius:6px}.drawer-links a.active{background:var(--surface2);color:var(--primary)}.drawer-actions{display:flex;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}.container{padding:18px 14px 36px}.page-title h1,h1{font-size:22px}.kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.quota-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.table-desktop{display:none}.user-list,.recipient-cards,.security-cards{display:grid;gap:10px}.grid2{grid-template-columns:1fr}.detail-row{grid-template-columns:1fr;gap:4px}}
@media(max-width:480px){.brand{font-size:14px}.logo-mark{width:32px;height:32px;flex-basis:32px;border-radius:10px}.logo-mark:before{bottom:7px;left:8px;width:5px;height:10px;box-shadow:7px -5px 0 #07101f,14px -11px 0 #07101f}.env-badge{display:none}.kpi-grid,.quota-grid{grid-template-columns:1fr 1fr}.kpi-value{font-size:20px}.toolbar .form-field{min-width:100%}.meta{grid-template-columns:95px minmax(0,1fr)}}
</style>

<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand"><span class="logo-mark" aria-hidden="true"></span><span>看店勢 DianInsight</span><span class="env-badge">DEMO</span></div>
    <nav class="desktop-nav" id="desktopNav"></nav>
    <div class="account"><button class="btn btn-ghost btn-sm" id="localeBtn">EN</button><button class="btn btn-ghost btn-sm theme-toggle">☀️</button><span class="who">Jack · admin</span><a class="btn btn-ghost btn-sm logout" href="/">回介紹頁</a></div>
    <button class="mobile-menu-toggle" id="menuBtn" aria-label="行動選單">☰</button>
  </div>
</header>
<div class="mobile-nav" id="mobileNav"><div class="scrim" id="scrim"></div><aside class="drawer"><div class="drawer-title"><span class="logo-mark" aria-hidden="true"></span>看店勢 DianInsight</div><nav class="drawer-links" id="drawerLinks"></nav><div class="drawer-actions"><button class="btn btn-sm" id="drawerLocale">EN</button><button class="btn btn-sm theme-toggle">☀️</button><a href="/" class="btn btn-sm">回介紹頁</a></div></aside></div>
<main class="container" id="main"></main>
<script>
const pages=[['dashboard','儀表板'],['sales','銷售'],['rankings','排行榜'],['notifications','通知'],['recipients','收件人'],['organization','組織'],['security','安全紀錄'],['modules','模組']];
const main=document.getElementById('main'),mobileNav=document.getElementById('mobileNav');
function navMarkup(){return pages.map(([p,l])=>`<a href="#${p}" data-page="${p}">${l}</a>`).join('')}
document.getElementById('desktopNav').innerHTML=navMarkup();document.getElementById('drawerLinks').innerHTML=navMarkup();
document.getElementById('menuBtn').onclick=()=>mobileNav.classList.add('open');document.getElementById('scrim').onclick=()=>mobileNav.classList.remove('open');
document.querySelectorAll('[data-page]').forEach(a=>a.onclick=e=>{e.preventDefault();render(a.dataset.page);mobileNav.classList.remove('open')});
function setActive(page){document.querySelectorAll('[data-page]').forEach(a=>a.classList.toggle('active',a.dataset.page===page))}
function toggleTheme(){const root=document.documentElement;root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';document.querySelectorAll('.theme-toggle').forEach(b=>b.textContent=root.dataset.theme==='dark'?'☀️':'🌙')}
document.querySelectorAll('.theme-toggle').forEach(b=>b.onclick=toggleTheme);
function shell(title,body,subtitle=''){main.innerHTML=`<div class="page-title"><div><h1>${title}</h1>${subtitle?`<p>${subtitle}</p>`:''}</div></div>${body}`}
function metric(label,value,sub=''){return `<div class="kpi"><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div>${sub?`<div class="kpi-sub">${sub}</div>`:''}</div>`}
const quick=`<div class="quick-range">${['今天','昨天','最近 7 天','最近 30 天','本週','上週','本月','上月'].map(x=>`<button class="qr-btn">${x}</button>`).join('')}</div>`;
const users=[{id:1,name:'Bob',username:'M088',email:'bob@gmail.com',role:'門市主管',scope:'門市 · A002 — 台北B店',status:'等待啟用',lang:'繁體中文',created:'2026年9月9日',invite:'邀請已寄出'},{id:2,name:'C001',username:'C001',email:'c001@gmail.com',role:'區域主管',scope:'區域 · 北一區',status:'已啟用',lang:'繁體中文',created:'2026年9月8日',invite:'—'},{id:3,name:'RIO',username:'M006',email:'rio@gmail.com',role:'門市主管',scope:'門市 · B001 — 桃園A店',status:'等待啟用',lang:'English',created:'2026年9月8日',invite:'邀請已寄出'},{id:4,name:'Simon',username:'M089',email:'simon@gmail.com',role:'區域主管',scope:'區域 · 北二區',status:'已啟用',lang:'繁體中文',created:'2026年9月7日',invite:'—'}];
const recipients=[{id:1,name:'營運主管',email:'ops@example.com',channel:'email',enabled:true},{id:2,name:'北區主管',email:'north@example.com',channel:'email',enabled:true},{id:3,name:'備援信箱',email:'backup@example.com',channel:'email',enabled:false}];
function bindQuick(){document.querySelectorAll('.qr-btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.qr-btn').forEach(x=>x.style.outline='');b.style.outline='2px solid var(--primary)'})}
function dashboard(){shell('儀表板',`<div class="panel"><div class="toolbar"><div class="form-field"><label>開始日期</label><input type="date" value="2026-08-01"></div><div class="form-field"><label>結束日期</label><input type="date" value="2026-08-31"></div><button class="btn">重新整理</button>${quick}</div></div><p class="scope-indicator">期間：2026/08/01 ～ 2026/08/31　比較期間：2025/08/01 ～ 2025/08/31</p><section class="kpi-grid">${metric('營收','NT$1,063,795')}${metric('目標營收','NT$1,440,000')}${metric('達成率','73.87%')}${metric('交易數','5,408')}${metric('來客數','5,875')}${metric('本月累計營收','NT$1,063,795')}${metric('較去年同期','↗ 3.62%','+ NT$37,184')}</section><section class="section"><h2>區域排名</h2><div class="table-wrap"><table class="table"><thead><tr><th>排名</th><th>區域</th><th>達成率</th><th>營收</th></tr></thead><tbody><tr><td>1</td><td>北一區</td><td>73.87%</td><td>NT$1,063,795</td></tr></tbody></table></div></section>`);bindQuick()}
function sales(){shell('銷售',`<div class="panel"><div class="toolbar"><div class="form-field"><label>開始日期</label><input type="date" value="2026-08-01"></div><div class="form-field"><label>結束日期</label><input type="date" value="2026-08-31"></div><div class="form-field"><label>區域</label><select><option>所有區域</option><option>北一區</option><option>北二區</option></select></div><div class="form-field"><label>分店</label><select><option>所有分店</option><option>台北A店</option><option>台北B店</option><option>台北C店</option></select></div><button class="btn">重新整理</button>${quick}</div></div><p class="scope-indicator">目前檢視：全部 ＞ 全部分店</p><section class="kpi-grid">${metric('營收','NT$1,063,795')}${metric('目標','NT$1,440,000')}${metric('達成率','73.87%')}${metric('交易數','5,408')}${metric('來客數','5,875')}</section><section class="section"><div class="page-title"><div><h2>AI 分析</h2></div><button class="btn btn-primary" id="aiBtn">AI 分析</button></div><div id="aiOutput" class="ai-grid hidden"><div class="card ai-card"><div class="ai-title">🤖 摘要</div><div class="ai-body">分析期間為 2026-08-01 至 2026-08-31，整體營收 1,063,795 元，目標達成率 73.87%，較去年同期成長 3.62%。</div></div><div class="card ai-card"><div class="ai-title">整體洞察</div><div class="ai-body">整體營收仍低於目標，北一區維持正成長，建議持續追蹤門市達成率與交易量。</div></div><div class="card"><div class="ai-title">區域分析</div><div class="ai-body"><ul><li>北一區：營收 1,063,795 元，交易筆數 5,408 筆，來客數 5,875 人。</li></ul></div></div><div class="card"><div class="ai-title">店鋪分析</div><div class="table-wrap"><table class="table"><tr><th>店鋪</th><th>營收</th><th>交易</th><th>來客</th><th>目標</th><th>達成率</th></tr><tr><td>台北A店</td><td>361,627</td><td>2,138</td><td>2,205</td><td>470,000</td><td>76.94%</td></tr><tr><td>台北B店</td><td>292,681</td><td>1,582</td><td>1,720</td><td>440,000</td><td>66.52%</td></tr><tr><td>台北C店</td><td>409,487</td><td>1,688</td><td>1,950</td><td>530,000</td><td>77.26%</td></tr></table></div></div><div class="card ai-card warn"><div class="ai-title">⚠️ 異常分析</div><div class="ai-body">台北C店成長率為 -4.43%，已出現明顯異常。由於目前資料不足，無法進一步判斷確切原因。</div></div><div class="card"><div class="ai-title">主管需要注意</div><div class="ai-body"><ul><li>台北B店達成率 66.52%，三家店中最低，建議優先關注。</li></ul></div></div></div></section><section class="section"><h2>上傳業績資料</h2><div class="card upload-box"><div class="small">下載範本後填寫日期、分店代碼、營收、交易數與來客數，再上傳完成的 .xlsx 檔案。</div><div><button class="btn">下載 Excel 範本</button></div><input type="file" accept=".xlsx"><button class="btn btn-primary">上傳資料</button></div></section>`);bindQuick();document.getElementById('aiBtn').onclick=()=>{document.getElementById('aiOutput').classList.remove('hidden');document.getElementById('aiBtn').textContent='重新分析'}}
function rankings(){shell('排行榜',`<div class="panel"><div class="toolbar"><div class="form-field"><label>開始日期</label><input type="date" value="2026-08-01"></div><div class="form-field"><label>結束日期</label><input type="date" value="2026-08-31"></div><div class="form-field"><label>區域</label><select><option>所有區域</option><option>北一區</option></select></div><div class="form-field"><label>分店</label><select><option>所有分店</option><option>台北A店</option></select></div><button class="btn">重新整理</button>${quick}</div></div><p class="scope-indicator">目前檢視：全部 ＞ 全部分店</p><section class="section"><h2>區域排名</h2><div class="table-wrap"><table class="table"><thead><tr><th>排名</th><th>名稱</th><th>達成率</th><th>營收</th></tr></thead><tbody><tr><td>1</td><td>北一區</td><td>73.87%</td><td>NT$1,063,795</td></tr><tr><td>2</td><td>北二區</td><td>69.12%</td><td>NT$918,420</td></tr><tr><td>3</td><td>中一區</td><td>65.48%</td><td>NT$801,350</td></tr></tbody></table></div></section>`);bindQuick()}
function notifications(){shell('通知',`<section class="card"><h2 style="margin-top:0">Email 通知</h2><p class="status-on">已啟用</p></section><section class="section"><div class="page-title"><div><h2>手動寄送報表</h2><p>選擇日期、區域與收件人後寄送 Email 報表。</p></div><span class="plan-badge">額度模式：每日</span></div><div class="quota-grid"><div class="quota-card"><span>手動寄送使用量</span><strong>12 / 50</strong></div><div class="quota-card"><span>剩餘</span><strong>38</strong></div><div class="quota-card"><span>下次重置</span><strong>2026-09-13（台灣時間）</strong></div></div><form class="card toolbar" style="margin-top:10px" onsubmit="event.preventDefault();this.querySelector('button').textContent='寄送中…';setTimeout(()=>this.querySelector('button').textContent='寄送報表',700)"><div class="form-field"><label>開始日期</label><input type="date" value="2026-09-01"></div><div class="form-field"><label>結束日期</label><input type="date" value="2026-09-12"></div><div class="form-field"><label>區域</label><select><option>北一區</option><option>北二區</option></select></div><div class="form-field"><label>收件人</label><select><option>營運主管 — ops@example.com</option><option>北區主管 — north@example.com</option></select></div><button class="btn btn-primary">寄送報表</button></form></section><section class="section"><h2>寄送測試 Email</h2><form class="card toolbar" onsubmit="event.preventDefault();alert('模擬：測試信已送出')"><div class="form-field"><label>收件人 Email</label><input type="email" value="admin@example.com"></div><button class="btn">寄送</button></form></section><section class="section"><h2>寄送每日 KPI</h2><form class="card toolbar" onsubmit="event.preventDefault();alert('模擬：每日 KPI 已送出')"><div class="form-field"><label>營業日期</label><input type="date" value="2026-09-12"></div><div class="form-field"><label>範圍</label><select><option>公司</option><option>區域</option><option>分店</option></select></div><div class="form-field"><label>區域 ID</label><input placeholder="選填"></div><div class="form-field"><label>分店 ID</label><input placeholder="選填"></div><button class="btn">寄送</button></form></section>`)}
function recipientsPage(){shell('收件人',`<section><h2>新增收件人</h2><form id="recipientAdd" class="card toolbar"><div class="form-field"><label>名稱</label><input id="recName" required></div><div class="form-field"><label>Email</label><input id="recEmail" type="email" required></div><button class="btn btn-primary">新增</button></form></section><section class="section"><h2>收件人清單</h2><div id="recipientArea"></div></section>`);renderRecipients();document.getElementById('recipientAdd').onsubmit=e=>{e.preventDefault();recipients.push({id:Date.now(),name:document.getElementById('recName').value,email:document.getElementById('recEmail').value,channel:'email',enabled:true});renderRecipients();e.target.reset()}}
function renderRecipients(){const area=document.getElementById('recipientArea');if(!area)return;const rows=recipients.map(r=>`<tr><td>${r.name}</td><td>${r.email}</td><td>${r.channel}</td><td><span class="${r.enabled?'status-on':'status-off'}">${r.enabled?'通知開啟':'通知關閉'}</span></td><td><div class="action-row"><button class="btn btn-sm" onclick="toggleRecipient(${r.id})">${r.enabled?'停用':'啟用'}</button><button class="btn btn-sm" onclick="editRecipient(${r.id})">編輯</button><button class="btn btn-sm btn-danger" onclick="deleteRecipient(${r.id})">刪除</button></div></td></tr>`).join('');const cards=recipients.map(r=>`<article class="card recipient-card"><strong>${r.name}</strong><div class="small">${r.email}</div><div>${r.channel} · <span class="${r.enabled?'status-on':'status-off'}">${r.enabled?'通知開啟':'通知關閉'}</span></div><div class="action-row"><button class="btn btn-sm" onclick="toggleRecipient(${r.id})">${r.enabled?'停用':'啟用'}</button><button class="btn btn-sm" onclick="editRecipient(${r.id})">編輯</button><button class="btn btn-sm btn-danger" onclick="deleteRecipient(${r.id})">刪除</button></div></article>`).join('');area.innerHTML=`<div class="table-desktop table-wrap"><table class="table"><thead><tr><th>名稱</th><th>Email</th><th>管道</th><th>接收狀態</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table></div><div class="recipient-cards">${cards}</div>`}
window.toggleRecipient=id=>{const r=recipients.find(x=>x.id===id);r.enabled=!r.enabled;renderRecipients()};window.deleteRecipient=id=>{const i=recipients.findIndex(x=>x.id===id);if(i>=0&&confirm('確定刪除這個收件人？')){recipients.splice(i,1);renderRecipients()}};window.editRecipient=id=>{const r=recipients.find(x=>x.id===id),n=prompt('名稱',r.name),e=prompt('Email',r.email);if(n&&e){r.name=n;r.email=e;renderRecipients()}};
function organization(){shell('組織',`<div class="tabs"><button class="tab-btn active" data-tab="region">區域列表</button><button class="tab-btn" data-tab="store">分店列表</button><button class="tab-btn" data-tab="user">使用者</button></div><div id="region-tab" class="tab-pane active"></div><div id="store-tab" class="tab-pane"></div><div id="user-tab" class="tab-pane"></div>`);document.getElementById('region-tab').innerHTML=regionTab();document.getElementById('store-tab').innerHTML=storeTab();document.getElementById('user-tab').innerHTML=userTab();document.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab-pane').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab+'-tab').classList.add('active')});bindUserDirectory()}
function regionTab(){return `<div class="action-row" style="margin-bottom:12px"><button class="btn btn-primary" onclick="alert('模擬：新增區域表單')">新增區域</button></div><div class="table-wrap"><table class="table"><thead><tr><th>區域名稱 ↑</th><th>編輯</th><th>刪除</th></tr></thead><tbody><tr><td>北一區</td><td><button class="btn btn-sm">編輯</button></td><td><button class="btn btn-sm btn-danger">刪除</button></td></tr><tr><td>北二區</td><td><button class="btn btn-sm">編輯</button></td><td><button class="btn btn-sm btn-danger">刪除</button></td></tr><tr><td>中一區</td><td><button class="btn btn-sm">編輯</button></td><td><button class="btn btn-sm btn-danger">刪除</button></td></tr></tbody></table></div>`}
function storeTab(){return `<div class="toolbar" style="margin-bottom:12px"><div class="action-row"><button class="btn btn-sm btn-primary">全部</button><button class="btn btn-sm">啟用中</button><button class="btn btn-sm">已停用</button></div><button class="btn btn-primary" onclick="alert('模擬：新增分店表單')">新增分店</button></div><div class="table-wrap"><table class="table"><thead><tr><th>代碼 ↑</th><th>分店名稱</th><th>區域</th><th>狀態</th><th>操作</th></tr></thead><tbody><tr><td>A001</td><td>台北A店</td><td>北一區</td><td><span class="badge good">啟用中</span></td><td><div class="action-row"><button class="btn btn-sm">編輯</button><button class="btn btn-sm">停用</button></div></td></tr><tr><td>A002</td><td>台北B店</td><td>北一區</td><td><span class="badge good">啟用中</span></td><td><div class="action-row"><button class="btn btn-sm">編輯</button><button class="btn btn-sm">停用</button></div></td></tr><tr><td>B001</td><td>桃園A店</td><td>北二區</td><td><span class="badge wait">已停用</span></td><td><div class="action-row"><button class="btn btn-sm">編輯</button><button class="btn btn-sm">重新啟用</button></div></td></tr></tbody></table></div>`}
function userTab(){return `<section class="card"><button class="btn btn-primary" id="addUserToggle">＋ 新增使用者</button><div id="addUserForm" class="hidden" style="margin-top:12px"><div class="toolbar"><div class="form-field"><label>使用者名稱</label><input></div><div class="form-field"><label>姓名</label><input></div><div class="form-field"><label>Email</label><input></div><div class="form-field"><label>角色</label><select><option>管理員</option><option>區域主管</option><option>門市主管</option></select></div><div class="form-field"><label>語言</label><select><option>使用公司預設</option><option>繁體中文</option><option>English</option></select></div><button class="btn btn-primary">建立使用者</button></div></div></section><section class="card filter-panel" style="margin-top:10px"><div class="toolbar"><div class="form-field"><label>搜尋</label><input id="userQ" placeholder="搜尋姓名、使用者名稱或電子郵件"></div><div class="form-field"><label>角色</label><select id="userRole"><option value="">所有角色</option><option>管理員</option><option>區域主管</option><option>門市主管</option></select></div><div class="form-field"><label>狀態</label><select><option>所有狀態</option><option>等待啟用</option><option>已啟用</option><option>已停用</option></select></div><div class="form-field"><label>管理範圍</label><select><option>所有管理範圍</option><option>公司</option><option>區域</option><option>門市</option></select></div><button class="btn btn-primary" id="userSearch">搜尋</button></div></section><div class="resultline"><span id="userCount"></span><button class="btn btn-sm">清除篩選</button></div><div id="userArea"></div>`}
function bindUserDirectory(){document.getElementById('addUserToggle').onclick=()=>document.getElementById('addUserForm').classList.toggle('hidden');const run=()=>{const q=document.getElementById('userQ').value.toLowerCase(),role=document.getElementById('userRole').value;renderUsers(users.filter(u=>(!q||(`${u.name} ${u.username} ${u.email}`).toLowerCase().includes(q))&&(!role||u.role===role)))};document.getElementById('userSearch').onclick=run;renderUsers(users)}
function renderUsers(list){const area=document.getElementById('userArea');if(!area)return;document.getElementById('userCount').textContent=`共 ${list.length} 位使用者`;const rows=list.map(u=>`<tr><td><a href="#" class="link" onclick="showUser(${u.id});return false">${u.name}</a></td><td>${u.username}</td><td>${u.email}</td><td>${u.role}</td><td>${u.scope}</td><td>${u.status} · ${u.lang}</td><td>${u.invite}</td><td>${u.created}</td><td>${u.status==='等待啟用'?'<button class="btn btn-sm btn-primary">重新寄送邀請</button>':'—'}</td></tr>`).join('');const cards=list.map(u=>`<article class="card user-card"><div><a href="#" class="link" onclick="showUser(${u.id});return false"><strong>${u.name}</strong></a><div class="small">${u.username} · ${u.email}</div></div><div class="meta"><div class="k">角色</div><div>${u.role}</div><div class="k">範圍</div><div>${u.scope}</div><div class="k">狀態</div><div>${u.status}</div><div class="k">語言</div><div>${u.lang}</div><div class="k">邀請</div><div>${u.invite}</div></div>${u.status==='等待啟用'?'<button class="btn btn-primary">重新寄送邀請</button>':''}</article>`).join('');area.innerHTML=`<div class="table-desktop table-wrap"><table class="table"><thead><tr><th>姓名</th><th>使用者名稱</th><th>Email</th><th>角色</th><th>範圍</th><th>狀態</th><th>邀請</th><th>建立日期</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table></div><div class="user-list">${cards}</div>`}
window.showUser=id=>{const u=users.find(x=>x.id===id);setActive('organization');shell(u.name,`<div class="user-detail"><div style="margin-bottom:14px"><a href="#" class="link" id="backOrg">← 組織</a><p class="small">${u.username} · ${u.email}</p></div><section class="card"><div class="detail-row"><div class="k">使用者名稱</div><div>${u.username}</div></div><div class="detail-row"><div class="k">Email</div><div>${u.email}</div></div><div class="detail-row"><div class="k">角色</div><div>${u.role}</div></div><div class="detail-row"><div class="k">狀態</div><div>${u.status}</div></div><div class="detail-row"><div class="k">語言</div><div>${u.lang}</div></div><div class="detail-row"><div class="k">管理範圍</div><div>${u.scope}</div></div><div class="detail-row"><div class="k">建立日期</div><div>${u.created}</div></div>${u.status==='等待啟用'?`<div class="detail-row"><div class="k">邀請狀態</div><div>${u.invite}</div></div>`:''}</section></div>`);document.getElementById('backOrg').onclick=e=>{e.preventDefault();organization()}};
const securityEvents=[{code:'AUTH_LOGIN_SUCCEEDED',label:'登入成功',out:'成功',sev:'INFO',user:'Bob',method:'password',ip:'100.67.105.115',device:'Mobile Safari · iPhone',time:'2026-09-12 12:48',reason:'—'},{code:'USER_PROVISIONED',label:'建立使用者',out:'成功',sev:'INFO',user:'Jack',method:'—',ip:'100.67.105.10',device:'Safari · macOS',time:'2026-09-12 11:41',reason:'建立門市主管 M088'},{code:'AUTH_LOGIN_FAILED',label:'登入失敗',out:'失敗',sev:'WARNING',user:'unknown',method:'password',ip:'203.0.113.55',device:'Chrome · Windows',time:'2026-09-12 10:16',reason:'密碼錯誤'}];
function security(){shell('安全紀錄',`<p class="muted">檢視驗證、使用者建立與邀請相關安全事件。</p><form class="card toolbar" onsubmit="event.preventDefault()"><div class="form-field"><label>事件</label><select><option>全部</option><option>登入成功</option><option>登入失敗</option><option>登出</option><option>建立使用者</option><option>邀請已寄出</option></select></div><div class="form-field"><label>嚴重性</label><select><option>全部</option><option>INFO</option><option>WARNING</option><option>CRITICAL</option></select></div><div class="form-field"><label>結果</label><select><option>全部</option><option>成功</option><option>失敗</option><option>拒絕</option></select></div><div class="form-field"><label>驗證方式</label><select><option>全部</option><option>password</option><option>magic_link</option><option>passkey</option><option>sso</option></select></div><button class="btn btn-primary">套用</button></form><div id="securityArea" class="section"></div>`);const rows=securityEvents.map(e=>`<tr><td>${e.time}</td><td><strong>${e.label}</strong></td><td><span class="badge ${e.out==='成功'?'good':'bad'}">${e.out}</span></td><td><span class="badge">${e.sev}</span></td><td>${e.user}</td><td>${e.method}</td><td>${e.ip}</td><td>${e.device}</td><td>${details(e)}</td></tr>`).join('');const cards=securityEvents.map(e=>`<article class="card security-card"><div><strong>${e.label}</strong><div class="small">${e.time}</div></div><div class="action-row"><span class="badge ${e.out==='成功'?'good':'bad'}">${e.out}</span><span class="badge">${e.sev}</span></div><div class="meta"><div class="k">使用者</div><div>${e.user}</div><div class="k">驗證方式</div><div>${e.method}</div><div class="k">網路 IP</div><div>${e.ip}</div><div class="k">裝置</div><div>${e.device}</div></div>${details(e)}</article>`).join('');document.getElementById('securityArea').innerHTML=`<div class="table-desktop table-wrap"><table class="table"><thead><tr><th>時間</th><th>事件</th><th>結果</th><th>嚴重性</th><th>使用者</th><th>驗證方式</th><th>網路 IP</th><th>裝置</th><th>詳細資料</th></tr></thead><tbody>${rows}</tbody></table></div><div class="security-cards">${cards}</div><p style="margin-top:12px"><button class="btn">下一頁</button></p>`}
function details(e){return `<details class="security-details"><summary>檢視詳細資料</summary><dl><div><dt>事件代碼</dt><dd>${e.code}</dd></div><div><dt>原因</dt><dd>${e.reason}</dd></div><div><dt>裝置</dt><dd>${e.device}</dd></div></dl></details>`}
function modules(){shell('模組',`<div class="card"><h2 style="margin-top:0">模組</h2><p class="muted">這個模擬器目前尚未取得正式產品的 Modules template，因此保留真實導覽位置，但不自行杜撰模組內容。</p></div>`)}
function render(page){setActive(page);if(page==='dashboard')dashboard();else if(page==='sales')sales();else if(page==='rankings')rankings();else if(page==='notifications')notifications();else if(page==='recipients')recipientsPage();else if(page==='organization')organization();else if(page==='security')security();else modules();window.scrollTo(0,0);history.replaceState(null,'','#'+page)}
const initial=location.hash.replace('#','');render(pages.some(x=>x[0]===initial)?initial:'dashboard');
</script>
</body>
