<body>
<header class="topbar">
  <div class="brand"><a class="brand-link" href="#dashboard" aria-label="看店勢 DianInsight"><img class="brand-logo-img" src="DianInsight%20logo%E2%80%93transparent.PNG" alt="看店勢 DianInsight"></a><div class="brand-meta"><span class="env-badge">DEMO</span><span class="version-label">版本：V6.1</span></div></div>
  <button id="mobile-menu-toggle" type="button" class="mobile-menu-toggle" aria-expanded="false" aria-controls="mobile-nav">☰</button>
  <nav class="desktop-nav" id="desktop-nav"></nav>
  <div class="account"><button type="button" class="btn btn-ghost btn-sm locale-toggle">EN</button><button type="button" class="btn btn-ghost theme-toggle">☀️</button><span class="username">Jack</span><span class="role">admin</span><a href="/" class="btn btn-ghost logout">回介紹頁</a></div>
</header>
<nav id="mobile-nav" class="mobile-nav"></nav>
<main class="container" id="main"></main>
<script>
const navItems=[['dashboard','儀表板'],['sales','銷售'],['rankings','排行榜'],['notifications','通知'],['recipients','收件人'],['organization','組織'],['security','安全紀錄'],['modules','模組']];
const main=document.getElementById('main'),desktopNav=document.getElementById('desktop-nav'),mobileNav=document.getElementById('mobile-nav'),menuToggle=document.getElementById('mobile-menu-toggle');
function navLinks(){return navItems.map(([p,l])=>`<a href="#${p}" data-page="${p}">${l}</a>`).join('')}
desktopNav.innerHTML=navLinks();mobileNav.innerHTML=navLinks()+`<div class="mobile-menu-section"><a href="/" class="btn btn-ghost">回介紹頁</a></div>`;
menuToggle.onclick=()=>{const open=menuToggle.getAttribute('aria-expanded')==='true';menuToggle.setAttribute('aria-expanded',String(!open));mobileNav.classList.toggle('open',!open)};
document.querySelectorAll('[data-page]').forEach(a=>a.onclick=e=>{e.preventDefault();render(a.dataset.page);mobileNav.classList.remove('open');menuToggle.setAttribute('aria-expanded','false')});
function setActive(p){document.querySelectorAll('[data-page]').forEach(a=>a.classList.toggle('active',a.dataset.page===p))}
function toggleTheme(){document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';document.querySelectorAll('.theme-toggle').forEach(b=>b.textContent=document.documentElement.dataset.theme==='dark'?'☀️':'🌙')}
document.querySelectorAll('.theme-toggle').forEach(b=>b.onclick=toggleTheme);
function qrs(){return `<div class="quick-range">${['今天','昨天','最近 7 天','最近 30 天','本週','上週','本月','上月'].map(x=>`<button type="button" class="qr-btn">${x}</button>`).join('')}</div>`}
function kpi(label,value,sub=''){return `<div class="kpi"><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div>${sub?`<div class="kpi-sub">${sub}</div>`:''}</div>`}
function table(headers,rows,cls=''){return `<div class="table-responsive"><table class="table ${cls}"><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function dashboard(){main.innerHTML=`<h1>儀表板</h1><form class="toolbar"><label>開始日期<input type="date" value="2026-08-01"></label><label>結束日期<input type="date" value="2026-08-31"></label><button class="btn">重新整理</button>${qrs()}</form><p class="scope-indicator">期間：2026/08/01 ～ 2026/08/31　比較期間：2025/08/01 ～ 2025/08/31</p><section class="kpi-grid">${kpi('營收','NT$1,063,795')}${kpi('目標營收','NT$1,440,000')}${kpi('達成率','73.87%')}${kpi('交易數','5,408')}${kpi('來客數','5,875')}${kpi('本月累計營收','NT$1,063,795')}${kpi('較去年同期','↗ 3.62%','+ NT$37,184')}</section><section><h2>區域排名</h2>${table(['排名','區域','達成率','營收'],[['1','北一區','73.87%','NT$1,063,795']])}</section>`}
function sales(){main.innerHTML=`<h1>銷售</h1><form class="toolbar"><label>開始日期<input type="date" value="2026-08-01"></label><label>結束日期<input type="date" value="2026-08-31"></label><label>區域<select><option>所有區域</option><option>北一區</option></select></label><label>分店<select><option>所有分店</option><option>A001 台北A店</option><option>A002 台北B店</option></select></label><button class="btn">重新整理</button>${qrs()}</form><p class="scope-indicator">目前檢視：全部 ＞ 全部分店</p><section class="kpi-grid">${kpi('營收','NT$1,063,795')}${kpi('目標','NT$1,440,000')}${kpi('達成率','73.87%')}${kpi('交易數','5,408')}${kpi('來客數','5,875')}</section><p class="subtitle">此日期有資料可供查詢。</p><section class="ai-analysis"><div class="ai-header"><h2>AI 分析</h2><button id="ai-analysis-btn" class="btn btn-primary">AI 分析</button></div><div id="ai-result" class="ai-result" style="display:none"><div class="ai-card ai-summary"><h3>🤖 摘要</h3><p>分析期間為 2026-08-01 至 2026-08-31，整體營收 1,063,795 元，目標達成率 73.87%，較去年同期成長 3.62%。</p></div><div class="ai-card"><h3>整體洞察</h3><p>整體營收未達目標，北一區維持正成長，建議持續追蹤。</p></div><div class="ai-card"><h3>區域分析</h3><ul class="ai-list"><li>北一區：營收 1,063,795 元，交易筆數 5,408 筆，來客數 5,875 人。</li></ul></div><div class="ai-card"><h3>店鋪分析</h3>${table(['店鋪','營收','交易筆數','來客數','目標營收','達成率'],[['台北A店','361,627','2,138','2,205','470,000','76.94%'],['台北B店','292,681','1,582','1,720','440,000','66.52%'],['台北C店','409,487','1,688','1,950','530,000','77.26%']])}</div><div class="ai-card ai-anomaly"><h3>⚠️ 異常分析</h3><p>台北C店成長率為 -4.43%，已出現明顯異常。由於目前資料不足，無法進一步判斷確切原因。</p></div><div class="ai-card"><h3>主管需要注意</h3><ul class="ai-list"><li>台北B店達成率 66.52%，三家店中最低，建議優先關注。</li></ul></div></div></section><section class="upload-section"><h2>上傳業績資料</h2><p class="upload-help">使用範本可以快速匯入業績資料。</p><p class="upload-template"><button class="btn">下載 Excel 範本</button></p><form class="upload-form"><label class="upload-label">選擇完成的檔案</label><div class="upload-file-row"><input type="file" accept=".xlsx"><button class="btn btn-primary">上傳資料</button></div></form></section>`;document.getElementById('ai-analysis-btn').onclick=()=>document.getElementById('ai-result').style.display='grid'}

const recs=[{id:1,name:'營運主管',email:'ops@example.com',enabled:true},{id:2,name:'北區主管',email:'north@example.com',enabled:true},{id:3,name:'備援信箱',email:'backup@example.com',enabled:false}];function recipients(){main.innerHTML=`<h1>收件人</h1><section><h2>新增收件人</h2><form class="toolbar recipient-add-form"><div class="form-field"><label>名稱</label><input required></div><div class="form-field"><label>Email</label><input type="email" required></div><button class="btn">新增</button></form></section><section><h2>收件人清單</h2><div class="recipient-table-wrap">${table(['名稱','Email','管道','接收狀態','操作'],recs.map(r=>[r.name,r.email,'email',`<span class="${r.enabled?'status-on':'status-off'}">${r.enabled?'通知開啟':'通知關閉'}</span>`,`<button class="btn btn-sm" onclick="toggleRec(${r.id})">${r.enabled?'停用':'啟用'}</button> <button class="btn btn-sm recipient-edit-toggle" onclick="editRec(${r.id})">編輯</button> <button class="btn btn-sm btn-danger">刪除</button>`]))}</div><div class="recipient-cards">${recs.map(r=>`<div class="recipient-card"><div class="recipient-card-row"><span class="recipient-card-label">收件人</span><strong>${r.name}</strong></div><div class="recipient-card-row"><span class="recipient-card-label">Email</span><span class="recipient-card-email">${r.email}</span></div><div class="recipient-card-row"><span class="recipient-card-label">管道</span><span>email</span></div><div class="recipient-card-row"><span class="recipient-card-label">接收狀態</span><span class="${r.enabled?'status-on':'status-off'}">${r.enabled?'通知開啟':'通知關閉'}</span></div><div class="recipient-card-actions"><button class="btn btn-sm" onclick="editRec(${r.id})">編輯</button><button class="btn btn-sm" onclick="toggleRec(${r.id})">${r.enabled?'停用':'啟用'}</button><button class="btn btn-sm btn-danger">刪除</button></div><div class="recipient-inline-edit-panel hidden" id="rec-edit-${r.id}"><form class="recipient-inline-edit"><div class="form-field"><label>名稱</label><input value="${r.name}"></div><div class="form-field"><label>Email</label><input type="email" value="${r.email}"></div><div class="recipient-inline-edit-actions"><button class="btn btn-primary">儲存</button><button type="button" class="btn" onclick="editRec(${r.id})">取消</button></div></form></div></div>`).join('')}</div></section>`}window.toggleRec=id=>{const r=recs.find(x=>x.id===id);r.enabled=!r.enabled;recipients()};window.editRec=id=>{const p=document.getElementById('rec-edit-'+id);if(p)p.classList.toggle('hidden')}

function organization(){main.innerHTML=`<div class="organization-management"><h1>組織</h1><nav class="org-tabs"><button class="tab-btn active" data-orgtab="region">區域列表</button><button class="tab-btn" data-orgtab="store">分店列表</button><button class="tab-btn" data-orgtab="user">使用者</button></nav><div class="tab-content"><div class="tab-pane active" id="region-tab">${regionPane()}</div><div class="tab-pane" id="store-tab">${storePane()}</div><div class="tab-pane" id="user-tab">${userPane()}</div></div></div>`;document.querySelectorAll('[data-orgtab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-orgtab]').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab-pane').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.orgtab+'-tab').classList.add('active')});bindUserPane()}

function userPane(){return `<section class="org-form-panel org-user-form"><div class="org-user-provision-header"><button class="btn btn-primary" id="btn-user-provision-toggle">+ 新增使用者</button></div><div id="user-provision-panel" class="hidden"><div class="org-user-provision-panel-header"><h3>建立使用者</h3><button class="btn" id="btn-user-provision-cancel">取消</button></div><form><div class="org-form-row"><label><span>使用者名稱</span><input></label><label><span>姓名</span><input></label><label><span>Email</span><input type="email"></label><label><span>角色</span><select><option>管理員</option><option>區域主管</option><option>門市主管</option></select></label><label><span>語言</span><select><option>使用公司預設（繁體中文）</option><option>繁體中文</option><option>English</option></select><small>邀請信與介面將使用此語言</small></label><button class="btn btn-primary">建立使用者</button></div></form></div></section><section class="org-form-panel org-user-directory"><form class="org-user-directory-controls" id="userDirectoryForm"><label class="org-user-directory-search"><span>搜尋</span><input type="search" id="userDirectoryQuery" placeholder="搜尋姓名、使用者名稱或電子郵件"></label><label><span>角色</span><select id="userDirectoryRole"><option value="">所有角色</option><option>管理員</option><option>區域主管</option><option>門市主管</option></select></label><label><span>狀態</span><select><option>所有狀態</option><option>等待啟用</option><option>已啟用</option><option>已停用</option></select></label><label><span>管理範圍類型</span><select><option>所有管理範圍</option><option>公司</option><option>區域</option><option>門市</option></select></label><button class="btn btn-primary" type="submit">搜尋</button><div class="org-user-directory-mobile-sort"><label><span>排序依據</span><select><option>姓名</option><option>使用者名稱</option><option>Email</option><option>建立日期</option></select></label><label><span>排序方向</span><select><option>升冪</option><option>降冪</option></select></label></div></form><div class="org-user-directory-summary"><span id="userDirectoryResultCount"></span><button class="btn btn-sm hidden" id="btn function bindUserPane(){document.getElementById('btn-user-provision-toggle').onclick=()=>document.getElementById('user-provision-panel').classList.toggle('hidden');document.getElementById('btn-user-provision-cancel').onclick=()=>document.getElementById('user-provision-panel').classList.add('hidden');document.getElementById('userDirectoryForm').onsubmit=e=>{e.preventDefault();renderUserDirectory()};renderUserDirectory()}
function renderUserDirectory(){const q=(document.getElementById('userDirectoryQuery')?.value||'').toLowerCase();const list=users.filter(u=>!q||(`${u.name} ${u.username} ${u.email}`).toLowerCase().includes(q));document.getElementById('userDirectoryResultCount').textContent=`共 ${list.length} 位使用者`;document.getElementById('org-user-table-wrap').innerHTML=`<table class="table org-user-table"><thead><tr><th>姓名 ↑</th><th>使用者名稱</th><th>Email</th><th>角色</th><th>管理範圍</th><th>狀態</th><th>邀請</th><th>建立日期</th><th>操作</th></tr></thead><tbody>${list.map(u=>`<tr><td><a href="#" onclick="showUser(${u.id});return false" style="color:var(--primary)">${u.name}</a></td><td>${u.username}</td><td>${u.email}</td><td>${u.role}</td><td>${u.scope}</td><td>${u.status}</td><td>${u.invite}</td><td>${u.created}</td><td>${u.status==='等待啟用'?'<button class="btn btn-sm btn-primary">重新寄送邀請</button>':'—'}</td></tr>`).join('')}</tbody></table>`;document.getElementById('organization-user-cards').innerHTML=list.map(u=>`<article class="org-user-card"><h3><a href="#" onclick="showUser(${u.id});return false" style="color:var(--primary)">${u.name}</a></h3><p>${u.username} · ${u.email}</p><dl><div><dt>角色</dt><dd>${u.role}</dd></div><div><dt>管理範圍</dt><dd>${u.scope}</dd></div><div><dt>狀態</dt><dd>${u.status}</dd></div><div><dt>語言</dt><dd>${u.lang}</dd></div>${u.status==='等待啟用'?`<div><dt>邀請</dt><dd>${u.invite}</dd></div>`:''}</dl>${u.status==='等待啟用'?'<p><button class="btn btn-primary">重新寄送邀請</button></p>':''}</article>`).join('')}
window.showUser=id=>{const u=users.find(x=>x.id===id);setActive('organization');main.innerHTML=`<div class="org-user-detail"><div class="org-user-detail-header"><div><h1>${u.name}</h1><p>${u.username} · ${u.email}</p></div><a class="org-user-detail-back" href="#" id="detail-back">← 組織</a></div><section class="org-user-detail-card"><dl><div class="org-user-detail-row"><dt>使用者名稱</dt><dd>${u.username}</dd></div><div class="org-user-detail-row"><dt>Email</dt><dd>${u.email}</dd></div><div class="org-user-detail-row"><dt>角色</dt><dd>${u.role}</dd></div><div class="org-user-detail-row"><dt>狀態</dt><dd>${u.status}</dd></div><div class="org-user-detail-row"><dt>語言</dt><dd>${u.lang}</dd></div><div class="org-user-detail-row"><dt>管理範圍</dt><dd>${u.scope}</dd></div><div class="org-user-detail-row"><dt>建立日期</dt><dd>${u.created}</dd></div>${u.status==='等待啟用'?`<div class="org-user-detail-row"><dt>邀請</dt><dd>${u.invite}</dd></div>`:''}</dl></section></div>`;document.getElementById('detail-back').onclick=e=>{e.preventDefault();organization()}}

const events=[{time:'2026-09-12 12:48',label:'登入成功',out:'SUCCESS',sev:'INFO',user:'Bob',method:'password',ip:'100.67.105.115',device:'Mobile Safari · iPhone',code:'AUTH_LOGIN_SUCCEEDED'},{time:'2026-09-12 11:41',label:'建立使用者',out:'SUCCESS',sev:'INFO',user:'Jack',method:'—',ip:'100.67.105.10',device:'Safari · macOS',code:'USER_PROVISIONED'},{time:'2026-09-12 10:16',label:'登入失敗',out:'FAILURE',sev:'WARNING',user:'unknown',method:'password',ip:'203.0.113.55',device:'Chrome · Windows',code:'AUTH_LOGIN_FAILED'}];function eventDetails(e){return `<details class="security-details"><summary>檢視詳細資料</summary><dl><div><dt>事件代碼</dt><dd>${e.code}</dd></div><div><dt>裝置</dt><dd>${e.device}</dd></div></dl></details>`}function security(){main.innerHTML=`<section class="security-log-page"><div class="section-heading"><div><h1>安全紀錄</h1><p class="muted">檢視登入、登出、使用者建立與邀請寄送等安全事件。</p></div></div><form class="security-filters"><label><span>事件</span><select><option>全部</option><option>登入成功</option><option>登入失敗</option><option>登出</option><option>建立使用者</option><option>邀請已寄出</option><option>邀請寄送失敗</option></select></label><label><span>嚴重性</span><select><option>全部</option><option>INFO</option><option>WARNING</option><option>CRITICAL</option></select></label><label><span>結果</span><select><option>全部</option><option>成功</option><option>失敗</option><option>拒絕</option></select></label><label><span>驗證方式</span><select><option>全部</option><option>password</option><option>magic_link</option><option>passkey</option><option>sso</option></select></label><button class="btn btn-primary">套用</button></form><div class="security-table-wrap">${table(['時間','事件','結果','嚴重性','使用者','驗證方式','網路 IP','裝置','詳細資料'],events.map(e=>[e.time,`<strong>${e.label}</strong>`,`<span class="security-badge security-badge-${e.out}">${e.out==='SUCCESS'?'成功':'失敗'}</span>`,`<span class="security-badge security-badge-${e.sev}">${e.sev}</span>`,e.user,e.method,e.ip,e.device,eventDetails(e)]))}</div><div class="security-cards">${events.map(e=>`<article class="security-card"><div class="security-card-heading"><strong>${e.label}</strong><span>${e.time}</span></div><div class="security-badges"><span class="security-badge security-badge-${e.out}">${e.out==='SUCCESS'?'成功':'失敗'}</span><span class="security-badge security-badge-${e.sev}">${e.sev}</span></div><dl><div><dt>使用者</dt><dd>${e.user}</dd></div><div><dt>驗證方式</dt><dd>${e.method}</dd></div><div><dt>網路 IP</dt><dd>${e.ip}</dd></div><div><dt>裝置</dt><dd>${e.device}</dd></div></dl>${eventDetails(e)}</article>`).join('')}</div><p class="security-pagination"><button class="btn">下一頁</button></p></section>`}
