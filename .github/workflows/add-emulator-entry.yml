name: Add emulator landing entry
on:
  push:
    paths:
      - '.github/workflows/add-emulator-entry.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update landing page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old_nav = '<a href="#coming" class="nav-cta">搶先了解</a>'
          new_nav = '<a href="/emulator/" class="nav-cta">產品體驗</a>'
          old_primary = '''<a class="button primary" href="#features">\n              看看它能做什麼\n              <span aria-hidden="true">↓</span>\n            </a>'''
          new_primary = '''<a class="button primary" href="/emulator/">\n              立即體驗產品\n              <span aria-hidden="true">→</span>\n            </a>'''
          old_note = '專為多門市、多區域營運管理場景打造'
          new_note = '專為多門市、多區域營運管理場景打造<br>互動展示使用展示資料，不會連接任何真實企業資料。'
          for old in (old_nav, old_primary, old_note):
              if old not in s:
                  raise SystemExit(f'Expected landing markup not found: {old[:60]}')
          s = s.replace(old_nav, new_nav, 1).replace(old_primary, new_primary, 1).replace(old_note, new_note, 1)
          p.write_text(s)
          PY
          rm .github/workflows/add-emulator-entry.yml
          git config user.name Jack
          git config user.email jack@localhost
          git add index.html .github/workflows/add-emulator-entry.yml
          git commit -m "feat: link landing page to product emulator"
          git push
